name: Bouw en publiceer web-app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - name: Analyse
        run: ci/annotate.sh Analyse flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true
      - name: Tests
        run: ci/annotate.sh Tests flutter test
      - name: Stijlgalerij (SVG per stijl)
        continue-on-error: true
        run: GALLERY_OUT=ci-out/galerij flutter test test/styles_test.dart --plain-name gallery
      - name: Web build
        run: ci/annotate.sh Build flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Browsertest (iPhone/WebKit + Chrome)
        continue-on-error: true
        run: |
          mkdir -p /tmp/srv && ln -s "$PWD/build/web" "/tmp/srv/${{ github.event.repository.name }}"
          (cd /tmp/srv && nohup python3 -m http.server 8080 >/dev/null 2>&1 &)
          npm i --no-save --no-package-lock playwright
          npx playwright install --with-deps webkit chromium
          node ci/smoke_test.mjs "http://localhost:8080/${{ github.event.repository.name }}/" ci-out

      - name: Screenshots naar branch ci-screenshots
        if: always()
        run: |
          [ -d ci-out ] || exit 0
          cd ci-out
          git init -q -b ci-screenshots
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Browsertest ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-screenshots

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
